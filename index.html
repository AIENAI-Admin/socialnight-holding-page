:root {
  --bg: #0f0f0f;
  --plate-face: #202326;
  --plate-edge: #2A2E32;
  --green: #00DA66;
  --muted: #b3b3b3;
  --green-shadow: #005226;
  --pixel: "Press Start 2P", monospace;
  --ui: "Source Sans 3", "Adobe Clean", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

/* Both need overflow hidden, not just body: the off-state drift transforms push
   a view ~10px past the bottom edge, and overflow propagates html -> body, never
   body -> html. Left on html alone the viewport scrolls that 10px and shifts
   everything, the logo included. */
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font-family: var(--ui);
  overflow: hidden;
}

.defs {
  position: absolute;
  width: 0;
  height: 0;
}

/* The logo is the only route back to the countdown, so it sits above both
   views rather than alongside them at z-index 2. */
.logo-link {
  position: absolute;
  top: 28px;
  left: 24px;
  display: block;
  width: 112px;
  height: 24px;
  z-index: 3;
}

.logo-link:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 6px;
}

.logo {
  display: block;
  width: 112px;
  height: 24px;
  object-fit: cover;
}

/* Both views share the grid behind them, so only the foreground cross-fades.
   The outgoing view clears before the incoming one starts arriving, and each
   carries a 10px drift. The resting transform lives on the view itself; only
   the off states shift.

   Opacity and the drift start together, but the drift runs 100ms longer, so
   the content is gone before it settles and the eye never sees it stop. */
.view {
  opacity: 0;
  visibility: hidden;
  transition-property: opacity, transform, visibility;
  transition-duration: 300ms, 400ms, 0s;
  transition-timing-function: ease, ease, linear;
  transition-delay: 0s, 0s, 400ms;
}

.view.is-active {
  opacity: 1;
  visibility: visible;
  transition-delay: 200ms, 200ms, 0s;
}

/* The intro drifts downwards throughout its life: it arrives from above and
   leaves below, so the motion never reverses. The two offsets are distinct
   states, which is why leaving is tracked explicitly rather than inferred. */
.stage:not(.is-active) {
  transform: translate(-50%, calc(-50% - 10px));
}

.stage.is-leaving {
  transform: translate(-50%, calc(-50% + 10px));
}

/* The schedule rises into place and sinks back out. */
.schedule:not(.is-active) {
  transform: translateY(10px);
}

/* Used for one frame to reposition a hidden view without animating the jump. */
.view.no-transition {
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  .view,
  .view.is-active,
  .enter {
    transition: none;
  }
}

/* Centre stack: 758px wide, 40px between the headline block and the button. */
.stage {
  position: absolute;
  top: calc(50% + 0.5px);
  left: 50%;
  transform: translate(-50%, -50%);
  width: 758px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  z-index: 2;
}

.headline-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
}

.headline {
  margin: 0;
  width: 100%;
  font-family: var(--pixel);
  font-size: 44px;
  line-height: 46px;
  letter-spacing: -1.76px;
  font-weight: 400;
  text-align: center;
  color: #fff;
}

/* Countdown: three 60x93 units on a 98px pitch, colons centred in the gaps. */
.countdown {
  display: grid;
  grid-template-columns: 60px 38px 60px 38px 60px;
  align-items: start;
  width: 256px;
  height: 93px;
}

.unit {
  position: relative;
  width: 60px;
  height: 93px;
}

.plate {
  position: relative;
  width: 60px;
  height: 63px;
}

.plate-art {
  display: block;
  width: 60px;
  height: 63px;
}

.digits {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--pixel);
  font-size: 24px;
  line-height: 28px;
  letter-spacing: -0.96px;
  text-align: center;
  white-space: nowrap;
  color: #fff;
}

.label {
  position: absolute;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--ui);
  font-weight: 700;
  font-size: 16px;
  line-height: 18px;
  letter-spacing: -0.64px;
  text-align: center;
  white-space: nowrap;
  color: #fff;
}

/* Colons sit 2px lower than the digits, matching the Figma frame. */
.colon {
  margin-top: 20px;
  font-family: var(--pixel);
  font-size: 24px;
  line-height: 28px;
  letter-spacing: -0.96px;
  text-align: center;
  color: #fff;
}

.enter {
  position: relative;
  display: block;
  width: 136.23px;
  height: 43.9952px;
  text-decoration: none;
  transition: transform 150ms ease;
}

/* Scaling the anchor takes the plate and its label together. The label carries
   its own translateX(-50%), so it has to stay off the animated property or the
   two transforms overwrite each other and it jumps to the left edge. */
.enter:hover,
.enter:focus-visible {
  transform: scale(1.05);
}

.enter-art {
  display: block;
  width: 136.23px;
  height: 43.9952px;
}

.enter-text {
  position: absolute;
  top: 8.88px;
  left: 68.31px;
  transform: translateX(-50%);
  font-family: var(--pixel);
  font-size: 12.692px;
  line-height: 23.692px;
  letter-spacing: -0.2538px;
  white-space: nowrap;
  color: #000;
}

.enter:hover .enter-text,
.enter:focus-visible .enter-text {
  text-decoration: underline;
}

/* Run of show: a 680px column, left edge at 372px on the 1440px frame. */
.schedule {
  position: absolute;
  top: 80px;
  bottom: 0;
  left: calc(50% - 348px);
  width: 680px;
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 2;
}

.schedule-title {
  margin: 0;
  padding: 8px;
  border-bottom: 1px solid var(--green);
  font-family: var(--pixel);
  font-size: 24px;
  line-height: 28px;
  letter-spacing: -0.96px;
  font-weight: 400;
  color: #fff;
}

/* The heading only takes focus to carry the reader across the transition. */
.schedule-title:focus:not(:focus-visible) {
  outline: none;
}

.schedule-table {
  margin-top: 40px;
}

/* Scaled ~15% up from the Figma 13px, with the row box and the time column
   widened to match so nothing tightens or clips. Eleven rows at this size
   still clear the 832px frame without scrolling. */
.schedule-head,
.schedule-row {
  display: flex;
  align-items: center;
  font-family: var(--ui);
  font-weight: 700;
  font-size: 15px;
  line-height: 21px;
  color: #fff;
}

.schedule-head {
  height: 32px;
  background: var(--plate-face);
  letter-spacing: 0.9px;
}

.schedule-row {
  height: 56px;
}

.col-time {
  flex: none;
  width: 78px;
  padding: 0 8px;
}

.col-segment {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 0 16px;
}

.col-duration {
  flex: none;
  padding: 0 16px;
  text-align: right;
}

/* The row inherits bold from .schedule-row, so the UA's `b { bolder }` would
   resolve to 900 and only land on 700 for want of a heavier face. Pin it. */
.schedule-row .col-segment b {
  font-weight: 700;
}

/* The detail line steps back to regular, which is why a 400 face is loaded
   alongside the 700 one — without it, font matching reuses the bold. */
.schedule-row .col-segment small {
  font-weight: 400;
  font-size: 15px;
  line-height: 21px;
  color: var(--muted);
}

.schedule-row .col-duration {
  color: var(--muted);
}

/* Drawn at runtime by src/grid.js so the floor fills any viewport. */
.grid-pattern {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.grid-pattern > svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* Disco ball, Figma node 3746:10797: a 2px cord from the top edge down 140px,
   then a 100x100 ball at y=132, so the ball overlaps the last 8px of cord.
   Frame sits at x=1182 on the 1440 design, i.e. 158px in from the right.

   Horizontal position is the further right of two anchors. The right-hand one
   holds the design's corner offset, which is what wide screens get. The other
   keeps it clear of the 758px stage, and wins once the viewport is narrow
   enough that the corner offset would put the ball on top of the headline.
   Colliding is the worse failure of the two: html and body are overflow
   hidden, so an overlap cannot be scrolled away, whereas being pushed past
   the right edge just clips. */
.disco {
  position: fixed;
  top: 0;
  left: max(calc(100% - 258px), calc(50% + 399px));
  width: 100px;
  height: 232px;
  z-index: 1;
  pointer-events: none;
  /* Top of the cord. src/disco.js swings the whole element about this point,
     so the cord stays straight and the ball travels on its arc. */
  transform-origin: 50% 0;
}

/* Below this there is no room for it to be pushed into, and a half-clipped
   ball reads worse than no ball. */
@media (max-width: 900px) {
  .disco { display: none; }
}

.disco-cord {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 140px;
  background: #d9d9d9;
  opacity: 0.15;
}

  /* The only thing on either background layer that takes a pointer. Rounded so
     the grab target matches the ball rather than its bounding square; the
     image's own edge sits inside the inscribed circle, so nothing is clipped.

  border-radius: 50%;
  cursor: grab;
  touch-action: none;

.disco.is-dragging .disco-ball {
  cursor: grabbing;
}

/* Sound control, bottom right. Above both views at z-index 3 for the same
   reason the logo is: it has to stay available on the countdown and the run of
   show alike, and the run of show scrolls underneath it. */
.sound {
  position: fixed;
  right: 24px;
  bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 3;
  font-family: var(--pixel);
  font-size: 10px;
  line-height: 12px;
  letter-spacing: -0.4px;
}

.sound-label {
  margin-right: 2px;
  color: var(--muted);
}

/* font: inherit doesn't carry letter-spacing, which is not part of the font
   shorthand, so the buttons would track differently from the label. */
.sound-opt {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;
  color: #6b6b6b;
  cursor: pointer;
}

.sound-opt.is-current {
  color: var(--green);
}

.sound-opt:hover:not(.is-current) {
  color: #fff;
}

.sound-opt:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 4px;
}

/* A rule rather than a character: its height is then set in pixels and doesn't
   drift with the font's line box. */
.sound-sep {
  width: 1px;
  height: 12px;
  background: #3a3a3a;
}

/* Painted by src/lasers.js. Shares the grid's stacking band but comes later in
   the document, so the beams sit in front of the floor and behind the content
   without either needing its own z-index. */
.lasers {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
</style>

<script>
/* Perspective floor from Figma node 3725:7473.
 *
 * Figma exports this as 73 masked SVGs (~10MB) at one fixed size. The geometry
 * underneath is simple, so it is redrawn here to whatever the viewport is.
 *
 * Everything is expressed relative to the floor depth (horizon to bottom edge),
 * which keeps the grid self-similar: a taller viewport scales the whole floor
 * rather than revealing a differently-proportioned one. Row positions and the
 * bottom-edge column spacing match the measured design at 1440x832; the
 * columns terminate on a band rather than the Figma vanishing point.
 */
(() => {
  const svg = document.getElementById("grid");
  if (!svg) return;

  const HORIZON = 0.5112; // fraction of viewport height, from the 1440x832 frame
  const COLUMN_SLOPE = 0.40912; // sideways drift per pixel of depth, per column
  const REFERENCE_DEPTH = 406.947;
  const REFERENCE_STROKE = 2;
  const FAN = 40; // extra columns past the viewport edge, forming the haze at the horizon

  // Columns terminate along a horizontal band rather than a single vanishing
  // point. tanh puts the outer columns asymptotically at the band's two ends,
  // so the haze collects there instead of being lost off-screen.
  const BAND_WIDTH = 0.6; // fraction of viewport width spanned by the band
  const BAND_TAPER = 0.12; // column spacing at the band, relative to the bottom edge

  // Row positions as fractions of floor depth, measured off the Figma export.
  // They compress faster than a true perspective near the horizon, so they are
  // kept verbatim rather than derived.
  const ROWS = [
    0.994, 0.92551, 0.86256, 0.80392, 0.74914, 0.69803, 0.65001, 0.60507,
    0.56274, 0.52273, 0.48502, 0.44947, 0.41561, 0.38359, 0.35312, 0.32419,
    0.29664, 0.27047, 0.24538, 0.22137, 0.1986, 0.17659, 0.15565, 0.13549,
    0.1161, 0.09748, 0.07962, 0.06254, 0.04592, 0.03007, 0.01467,
  ];

  const FADE_TO = 0.06; // line opacity at the bottom edge; zero at the horizon

  function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const horizonY = h * HORIZON;
    const depth = h - horizonY;
    const originX = w / 2;
    const spread = COLUMN_SLOPE * depth; // column spacing at the bottom edge

    const parts = [
      `<defs><linearGradient id="grid-fade" gradientUnits="userSpaceOnUse" x1="0" y1="${horizonY.toFixed(2)}" x2="0" y2="${h}">` +
        `<stop offset="0" stop-color="#fff" stop-opacity="0"/>` +
        `<stop offset="1" stop-color="#fff" stop-opacity="${FADE_TO}"/>` +
        `</linearGradient></defs>`,
    ];
    const line = (x1, y1, x2, y2) =>
      parts.push(
        `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`
      );

    const halfBand = (BAND_WIDTH * w) / 2;
    const bandSpacing = BAND_TAPER * spread;

    const columns = Math.ceil(originX / spread) + FAN;
    for (let n = -columns; n <= columns; n++) {
      const top = originX + halfBand * Math.tanh((n * bandSpacing) / halfBand);
      const drift = originX + n * spread - top;
      // Cut each column where it leaves the viewport, sideways or at the bottom.
      const t =
        drift === 0 ? 1 : Math.min(1, (drift > 0 ? w - top : top) / Math.abs(drift));
      line(top, horizonY, top + drift * t, horizonY + depth * t);
    }

    for (const t of ROWS) {
      const y = horizonY + depth * t;
      line(0, y, w, y);
    }

    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("stroke", "url(#grid-fade)");
    svg.setAttribute("stroke-width", (REFERENCE_STROKE * (depth / REFERENCE_DEPTH)).toFixed(2));
    svg.innerHTML = parts.join("");
  }

  let queued = false;
  draw();
  addEventListener("resize", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      draw();
    });
  });
})();
</script>
<script>
/* The iMessage "Lasers" screen effect, rebuilt in one green and anchored to the
 * top edge rather than to a message bubble.
 *
 * Beams are rendered sharp into an offscreen buffer, then that whole buffer is
 * composited back three times at different blur radii: wide and faint for the
 * room glow, mid for the halo, tight to keep the edges readable. The blur is
 * what gives a beam its soft edge and the bloom inside it, and doing it once
 * over the whole fan also means crossings bloom together rather than each beam
 * carrying its own separate haze.
 *
 * Approximating that falloff by stacking nested wedges was tried first and does
 * not work at this scale. An edge line is only a few pixels across, so every
 * layer lands inside the same pixel column and the profile ends up quantised by
 * the raster, leaving the hard edge the layers were meant to remove.
 *
 * A beam is a shaft, not a line: two bright edge lines with a dimmer green fill
 * between them and a haze around the outside, four wedges in all. Blurring a
 * single bright centre line can only ever give a rope, because it has no
 * interior that is darker than its own edges; the structure has to be drawn in
 * before the blur can soften it.
 *
 * The source colour never changes; only intensity does. The original cycles the
 * hue, which is where most of its life comes from, so that life has to be found
 * elsewhere: every beam sways and flickers on its own period, and the periods
 * are deliberately unrelated so the fan never visibly repeats as a whole.
 *
 * Sits above the floor grid and below the content. Beams reaching the headline
 * are far enough down their falloff to stay well under white text.
 */
(() => {
  const canvas = document.getElementById("lasers");
  if (!canvas || !canvas.getContext) return;

  const ctx = canvas.getContext("2d");
  const buf = document.createElement("canvas");
  const bctx = buf.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  // Canvas filter is Chrome 52+, Firefox 49+, Safari 17+. Without it the beams
  // still draw, just without the bloom, so the page degrades rather than fails.
  const canBlur = typeof ctx.filter === "string";

  // Blur radius, alpha. Radii are in design pixels and scaled to the viewport
  // so the glow keeps its proportions rather than thinning out on big screens.
  const PASSES = [
    [30, 0.36],
    [10, 0.42],
    [2.5, 0.85],
  ];

  // A beam is a shaft, not a line: two bright edges with a green fill between
  // them. Drawing one glowing line per beam gave a rope rather than a shaft,
  // because a single blurred core has no interior to be dimmer than its edges.
  const EDGE_RGB = "190,255,220";
  const FILL_RGB = "0,218,102";
  const HALO_RGB = "0,218,102";
  // The fill has to stay well under the edges. Measured at parity the shaft
  // blurs into a flat bar and the edges stop reading as edges at all; the gap
  // below is what keeps them visible through the widest blur pass.
  const EDGE_ALPHA = 0.8;
  const FILL_ALPHA = 0.15;
  const HALO_ALPHA = 0.085;
  // Halo reaches this far outside the shaft, as a multiple of its half-width.
  const HALO_SPREAD = 1.9;

  // Design pixels the apex sits above the top edge, scaled with the viewport.
  const ORIGIN_LIFT = 64;

  // Shapes the sway. A plain sine spreads its speed evenly over the sweep and
  // reads as a drift; a galvanometer crosses its centre quickly and then
  // brakes into each extreme. Dropping the exponent below 1 sharpens the
  // crossing and lengthens the braking.
  //
  // It cannot go far. The derivative is unbounded at the crossing, so the beam
  // stops sweeping and starts teleporting: at 0.55, measured per frame rather
  // than per instant, the sweep sits under a third of its own top speed for
  // 98% of its travel and covers the rest in a couple of frames, which reads
  // as a twitch. 0.82 keeps about 40% of the sweep at speed and spends the
  // other 60% braking, which is the shape being aimed at.
  const SWAY_SHAPE = 0.82;

  function swing(phase) {
    const s = Math.sin(phase);
    return Math.sign(s) * Math.abs(s) ** SWAY_SHAPE;
  }

  // Fixed seed: the fan is authored, not random per load, so what gets reviewed
  // is what ships.
  const rand = (() => {
    let s = 0x2f6e2b1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  })();

  // Fewer than before: each beam is now a ribbon rather than a line, so the
  // same count would close the fan into a solid sheet.
  const BEAM_COUNT = 9;

  const BEAMS = Array.from({ length: BEAM_COUNT }, (_, i) => {
    const t = i / (BEAM_COUNT - 1);
    return {
      // Fanned across the lower half circle, jittered so the spacing never
      // looks stepped.
      angle: (t - 0.5) * 2.42 + (rand() - 0.5) * 0.4,
      sway: 0.04 + rand() * 0.1,
      // Crosses in 1.3 to 2.4 seconds. The shaping only redistributes speed
      // within a sweep, it cannot make one faster, so the period has to carry
      // the actual pace.
      swaySpeed: 1.3 + rand() * 1.1,
      swayPhase: rand() * Math.PI * 2,
      // Angular half-width, so a beam keeps its shape at any viewport size.
      // Sized against the blur rather than by eye: the widest pass is 30px, so
      // anything narrower than roughly 60px across gets its interior filled
      // straight back in and the two edges collapse into one line again. These
      // clear that from about a third of the way down the screen, which is
      // also where the reference beams start to separate.
      width: 0.045 + rand() * 0.085,
      // Half-thickness of an edge line. Small enough that the blur is what
      // gives it its visible width, as with the old core.
      edge: 0.0016 + rand() * 0.0016,
      flickerSpeed: 0.5 + rand() * 1.9,
      flickerPhase: rand() * Math.PI * 2,
      // Wide range on purpose: an evenly lit fan reads as a peacock tail, so a
      // few beams carry the eye and the rest sit back as haze.
      gain: 0.28 + rand() * 0.72,
      // How far the shaft opens and closes, as a fraction of its width. The
      // low end of the range is near zero on purpose: a fan where every beam
      // breathes reads as the whole thing pulsing, so some have to hold still
      // for the ones that move to be noticed.
      breathe: 0.06 + rand() * 0.42,
      // Roughly a 12 to 25 second cycle. Slower than this and the shaft is
      // only ever measurably wider, never seen to widen; faster and it stops
      // being a beam sweeping and starts being a shape animating.
      breatheSpeed: 0.26 + rand() * 0.27,
      // Phase is stepped by index rather than drawn from the seed. Random
      // phases clump, and any moment where most of the fan happens to be in
      // step turns the effect into a single global pulse. Spreading them round
      // the circle guarantees that whatever is opening has something else
      // closing against it; the unequal speeds then let the pairing drift so
      // it never settles into a visible rhythm.
      breathePhase: (i / BEAM_COUNT) * Math.PI * 2 + rand() * 0.5,
    };
  });

  let w = 0;
  let h = 0;
  let scale = 1;
  let raf = null;

  function resize() {
    // Deliberately 1x even on retina. Blur cost scales with pixel count, and at
    // dpr 2 the three passes are four times the work for detail that the blur
    // immediately destroys. Measured at 1440x832: ~5ms a frame at 1x, which
    // would not hold at 2x. Nothing in this layer has a hard edge to lose;
    // the grid and the text are separate elements and stay crisp.
    const dpr = 1;
    w = innerWidth;
    h = innerHeight;
    scale = Math.max(0.6, h / 832);

    for (const c of [canvas, buf]) {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Fills between two angular bounds either side of the beam axis. Bounds are
  // independent rather than symmetric so the same primitive draws the interior
  // fill, the halo around it, and each edge line as an off-centre sliver.
  function wedge(ox, oy, angle, a0, a1, reach, alpha, rgb) {
    const s0 = Math.sin(angle + a0);
    const c0 = Math.cos(angle + a0);
    const s1 = Math.sin(angle + a1);
    const c1 = Math.cos(angle + a1);

    // The apex is nudged off the origin so a zero-width sliver still has area.
    const near = 1;
    const ex = ox + Math.sin(angle) * reach;
    const ey = oy + Math.cos(angle) * reach;

    // Falloff is deliberately front-loaded. The reach has to exceed the screen
    // diagonal or shallow beams stop mid-air, but a gradient spread evenly over
    // that reach leaves them near full strength at the bottom edge, which is
    // what turns the fan into a solid sunburst.
    const grad = bctx.createLinearGradient(ox, oy, ex, ey);
    grad.addColorStop(0, `rgba(${rgb},${alpha})`);
    grad.addColorStop(0.05, `rgba(${rgb},${alpha})`);
    grad.addColorStop(0.24, `rgba(${rgb},${alpha * 0.3})`);
    grad.addColorStop(0.62, `rgba(${rgb},0)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);

    bctx.fillStyle = grad;
    bctx.beginPath();
    bctx.moveTo(ox + s0 * near, oy + c0 * near);
    bctx.lineTo(ox + s1 * near, oy + c1 * near);
    bctx.lineTo(ox + s1 * reach, oy + c1 * reach);
    bctx.lineTo(ox + s0 * reach, oy + c0 * reach);
    bctx.closePath();
    bctx.fill();
  }

  function draw(t) {
    const ox = w / 2;
    // Apex sits above the top edge so the pinch point where every shaft
    // collapses to a point is off-screen. Sitting it on the edge gave the fan
    // a visible origin, which reads as a light source in the room rather than
    // beams passing through it. Far enough up that the narrowest shaft has
    // opened past the blur by the time it crosses into view.
    const oy = -ORIGIN_LIFT * scale;
    const reach = Math.hypot(w, h) * 1.35;

    bctx.clearRect(0, 0, w, h);
    bctx.globalCompositeOperation = "lighter";

    for (const b of BEAMS) {
      const angle = b.angle + swing(t * b.swaySpeed + b.swayPhase) * b.sway;
      // Never fully off: a beam that blinks out and back reads as a glitch.
      const flicker = 0.72 + 0.28 * Math.sin(t * b.flickerSpeed + b.flickerPhase);
      const gain = b.gain * flicker;
      // Only the shaft opens and closes. The edges are lines, so they keep
      // their thickness and travel apart instead of fattening with it.
      const wd =
        b.width * (1 + Math.sin(t * b.breatheSpeed + b.breathePhase) * b.breathe);
      const ed = b.edge;

      // Outside in: haze around the shaft, the green interior, then the two
      // edges last so they sit on top of their own fill rather than under it.
      const halo = wd * HALO_SPREAD;
      wedge(ox, oy, angle, -halo, halo, reach, HALO_ALPHA * gain, HALO_RGB);
      wedge(ox, oy, angle, -wd, wd, reach, FILL_ALPHA * gain, FILL_RGB);
      wedge(ox, oy, angle, -wd - ed, -wd + ed, reach, EDGE_ALPHA * gain, EDGE_RGB);
      wedge(ox, oy, angle, wd - ed, wd + ed, reach, EDGE_ALPHA * gain, EDGE_RGB);
    }

    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";

    // Wash: lifts the black just enough that the beams look like they are
    // lighting the room rather than floating over it.
    const wash = ctx.createRadialGradient(ox, oy, 0, ox, oy, h * 0.7);
    wash.addColorStop(0, "rgba(0,218,102,0.055)");
    wash.addColorStop(0.5, "rgba(0,218,102,0.014)");
    wash.addColorStop(1, "rgba(0,218,102,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, w, h);

    if (canBlur) {
      for (const [radius, alpha] of PASSES) {
        ctx.filter = `blur(${(radius * scale).toFixed(2)}px)`;
        ctx.globalAlpha = alpha;
        ctx.drawImage(buf, 0, 0, w, h);
      }
      ctx.filter = "none";
      ctx.globalAlpha = 1;
    } else {
      ctx.drawImage(buf, 0, 0, w, h);
    }

    // Bloom, breathing on a period unrelated to any beam.
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.9);
    const r = Math.min(w, h) * 0.16 * pulse;
    const bloom = ctx.createRadialGradient(ox, oy, 0, ox, oy, r);
    bloom.addColorStop(0, "rgba(200,255,225,0.22)");
    bloom.addColorStop(0.3, "rgba(0,218,102,0.085)");
    bloom.addColorStop(1, "rgba(0,218,102,0)");
    ctx.fillStyle = bloom;
    ctx.fillRect(ox - r, oy - r, r * 2, r * 2);

    ctx.globalCompositeOperation = "source-over";
  }

  function frame(now) {
    draw(now / 1000);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    stop();
    if (reduced.matches) {
      draw(0);
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function stop() {
    if (raf !== null) cancelAnimationFrame(raf);
    raf = null;
  }

  resize();
  start();

  let queued = false;
  addEventListener("resize", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      resize();
      if (reduced.matches) draw(0);
    });
  });

  // Nothing to animate for a backgrounded tab.
  addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
  reduced.addEventListener("change", start);
})();
</script>
<script>
/* Makes the disco ball a pendulum you can drag.
 *
 * The whole .disco element rotates about the top of its cord rather than the
 * ball moving on its own, which is what a ball on a string actually does: the
 * cord stays straight and the ball tilts with it.
 *
 * Released, it integrates a damped pendulum rather than running a canned
 * keyframe animation. A fixed animation would always swing the same distance
 * for the same length of time, so a nudge and a hard flick would look
 * identical; here the release speed comes off the pointer and carries through.
 *
 * Idle cost is zero. The loop sleeps once the swing falls below a threshold
 * and is only woken by a release, so the page is not holding a frame open for
 * a ball that is hanging still, on top of what the lasers already cost.
 */
(() => {
  const root = document.querySelector(".disco");
  const ball = document.querySelector(".disco-ball");
  if (!root || !ball) return;

  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  // Pivot to centre of mass: 140px of cord, less the 8px the ball overlaps it,
  // plus the ball's 50px radius.
  const LENGTH = 182;
  // Not real gravity. Pixels are not metres, and at 9.81 the period works out
  // near 27 seconds, which reads as broken rather than slow. This gives about
  // 1.9s, which is what a ball on a short cord looks like.
  const GRAVITY = 2000;
  // Settles in about 11 seconds from a full-scale drag. Lighter damping looks
  // no better and keeps the corner of the page moving for nearly 20.
  const DAMPING = 1;
  // Past critical, so under reduced motion it returns to rest without ever
  // crossing centre. The drag still tracks; it just doesn't oscillate after.
  const REDUCED_DAMPING = 6;
  const MAX_ANGLE = 0.6;
  // Fixed substep. Integrating a whole frame at once goes unstable on a long
  // frame, and a dropped frame is exactly when the swing is worth keeping.
  const STEP = 1 / 240;
  const SLEEP_ANGLE = 0.002;
  const SLEEP_SPEED = 0.01;
  // A flick can report an enormous instantaneous speed, and this is a real
  // pendulum rather than an eased animation, so too much of it puts the ball
  // over the top: measured at 8 it carried 464 degrees, winding right round
  // the pivot instead of swinging. At 2.5 a hard flick from the drag limit
  // peaks near 53 degrees, which is as far as it can go and still read as a
  // swing.
  const MAX_RELEASE_SPEED = 2.5;
  // A pointer that came to rest before letting go should drop, not fling.
  const STALE_MS = 120;

  let angle = 0;
  let speed = 0;
  let pivotX = 0;
  let dragging = false;
  let pointerId = null;
  let lastAngle = 0;
  let lastTime = 0;
  let prev = 0;
  let carry = 0;
  let raf = null;

  function measure() {
    // Read the used style rather than the bounding box: the box is the rotated
    // one, so measuring it mid-swing would walk the pivot along with the ball.
    if (!root.offsetWidth) return;
    pivotX = parseFloat(getComputedStyle(root).left) + root.offsetWidth / 2;
  }

  // The cord swings and the ball counter-rotates by the same amount, so it
  // travels along the arc while keeping its own orientation. That is what a
  // ball on a chain does, as opposed to a bob on a rigid rod, and it is also
  // the only way the swing can go wide: the source is a photograph, so its
  // specular highlights are baked in, and carrying them round through 50
  // degrees reads as the room's lighting having swung rather than the ball.
  function render() {
    const t = angle ? `rotate(${angle.toFixed(5)}rad)` : "";
    root.style.transform = t;
    ball.style.transform = angle ? `rotate(${(-angle).toFixed(5)}rad)` : "";
  }

  // The CSS rotation that puts the ball under the pointer, taken from the
  // pointer's horizontal offset against the fixed cord length.
  //
  // The pointer's y is deliberately not used. It was the vertical leg of an
  // atan2, but it measures the absolute drop below the pivot, so dragging
  // downwards lengthened that leg and shrank the angle: the same 80px
  // sideways pull gave 30 degrees at the ball's resting height and 10 at
  // 300px below it, and a straight-down drag gave zero. Down-and-sideways is
  // the natural gesture on a ball hanging at the top of the screen, and a
  // drag that barely moved and then barely swung read as the ball having
  // seized. The cord can't stretch, so its length is the hypotenuse and the
  // horizontal offset alone fixes the angle.
  //
  // Note the sign. This returns a rotation, not a bearing, and a positive CSS
  // rotation carries a point hanging below the origin to the left: six
  // o'clock going clockwise arrives at seven, not five. Measuring the offset
  // the other way round and handing that straight to rotate() sends the ball
  // away from the pointer.
  function angleFor(x) {
    const reach = Math.max(-1, Math.min(1, (pivotX - x) / LENGTH));
    const a = Math.asin(reach);
    return Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, a));
  }

  function frame(now) {
    const damping = reduced.matches ? REDUCED_DAMPING : DAMPING;
    carry += Math.min(0.05, (now - prev) / 1000);
    prev = now;

    while (carry >= STEP) {
      speed += (-(GRAVITY / LENGTH) * Math.sin(angle) - damping * speed) * STEP;
      angle += speed * STEP;
      carry -= STEP;
    }
    render();

    if (Math.abs(angle) < SLEEP_ANGLE && Math.abs(speed) < SLEEP_SPEED) {
      angle = 0;
      speed = 0;
      render();
      raf = null;
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function wake() {
    if (raf !== null) return;
    prev = performance.now();
    carry = 0;
    raf = requestAnimationFrame(frame);
  }

  ball.addEventListener("pointerdown", (e) => {
    measure();
    dragging = true;
    pointerId = e.pointerId;
    ball.setPointerCapture(pointerId);
    root.classList.add("is-dragging");
    if (raf !== null) {
      cancelAnimationFrame(raf);
      raf = null;
    }
    speed = 0;
    angle = angleFor(e.clientX);
    lastAngle = angle;
    lastTime = performance.now();
    render();
    e.preventDefault();
  });

  ball.addEventListener("pointermove", (e) => {
    if (!dragging || e.pointerId !== pointerId) return;
    const next = angleFor(e.clientX);
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    // Sampling every move event makes the release speed jittery on a fast
    // pointer; a floor on dt averages over enough travel to be stable.
    if (dt > 0.008) {
      speed = (next - lastAngle) / dt;
      lastAngle = next;
      lastTime = now;
    }
    angle = next;
    render();
  });

  function release(e) {
    if (!dragging || (e && e.pointerId !== pointerId)) return;
    dragging = false;
    pointerId = null;
    root.classList.remove("is-dragging");
    if (performance.now() - lastTime > STALE_MS) speed = 0;
    speed = Math.max(-MAX_RELEASE_SPEED, Math.min(MAX_RELEASE_SPEED, speed));
    wake();
  }

  ball.addEventListener("pointerup", release);
  ball.addEventListener("pointercancel", release);
  // Capture can be dropped without a pointerup ever reaching the ball. Left
  // unhandled, dragging stays true for good: the ball holds its angle, ignores
  // the physics loop and keeps the grabbing cursor, which is the one way it can
  // genuinely seize rather than just swing weakly.
  ball.addEventListener("lostpointercapture", release);

  measure();
  addEventListener("resize", measure);
})();
</script>

 * a quiet tick as the button goes down and a louder one as it comes back up,

 * the press actually lasts. A long hold holds the click open, which a single

 * no rewind, so repeated taps always sound and overlap cleanly instead of
 * cutting each other off.

  // to close the click, so the release is watched on the window. The flag keeps
  // that from firing on presses that started anywhere but the button.
  let armed = false;

  function bytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;

    if (!ctx) {
      ctx = new Ctx();
      for (const name of Object.keys(SOUNDS)) {
        decoded[name] = ctx.decodeAudioData(bytes(SOUNDS[name]));
      }

    // started from a gesture.
    if (ctx.state === "suspended") ctx.resume().catch(() => {});

    const here = ctx;

      .then((buffer) => {
        const src = here.createBufferSource();
        const gain = here.createGain();

        gain.gain.value = VOLUME;
        src.connect(gain).connect(here.destination);
        src.start();
      })

      .catch(() => {});
  }

  function press() {
    armed = true;
    play("down");
  }

  function release() {
    if (!armed) return;
    armed = false;
    play("up");
  }

  enter.addEventListener("pointerdown", press);

  // Enter and Space activate the link too, and holding either repeats keydown.
  enter.addEventListener("keydown", (e) => {
    if (e.repeat || (e.key !== "Enter" && e.key !== " ")) return;
    press();
  });

  // All three on the window: activating the link hands focus to the schedule
  // heading, so by the time the key comes back up the button no longer has it
  // and a listener bound to the button would never hear the release.
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);
  addEventListener("keyup", release);
})();

<script>
/* Background music, off by default.
 *
 * The track is referenced by URL rather than inlined. It is 2.1MB, which is
 * ~2.9MB once base64'd into a 142KB page, so inlining would make every visitor
 * pay for audio most of them never turn on. The URL is absolute rather than
 * relative because the standalone file gets opened from contexts with no base
 * URL, where a relative path silently resolves to nothing. Nothing is fetched
 * until someone asks for sound.
 *
 * An <audio> element, not decodeAudioData. Web Audio decodes to uncompressed
 * Float32, so 135 seconds of 44.1kHz stereo would sit resident at ~48MB, and
 * all that buys is sample-accurate scheduling that background music has no use
 * for. click.js is the opposite case and correctly uses Web Audio: its sounds
 * are milliseconds long and have to land on the exact edge of a press.
 *
 * Off is the default, and the choice is remembered. Autoplay is blocked until a
 * gesture, so a returning visitor's stored "on" is attempted rather than
 * assumed: if it is refused, the control waits for their next interaction and
 * honours it then, instead of displaying ON over silence.
 *
 * There is deliberately no fade. It was written with one and removed: ramping
 * up from zero means the element spends its first moments silent, and Chrome
 * treats silent media in a backgrounded page as video-only and pauses it to
 * save power, which rejects the pending play() with an AbortError. Anyone who
 * turned sound on and changed tab inside the fade got nothing. The ramp can't
 * be moved to a Web Audio gain node either: MediaElementSource on a
 * cross-origin stream without CORS outputs silence, and this track is
 * cross-origin by design. Starting at the target level costs a soft entry;
 * stopping dead is what someone pressing OFF is asking for anyway.
 */
(() => {
  const TRACK = "https://aienai-admin.github.io/socialnight-holding-page/assets/music.mp3";
  const KEY = "aienai-sound";
  // Background level. The track peaks at -3.9dB, so it is mastered loud and
  // carries the room from down here.
  const VOLUME = 0.3;

  const group = document.querySelector(".sound");
  if (!group) return;

  const options = new Map(
    [...group.querySelectorAll("[data-sound]")].map((b) => [b.dataset.sound, b])
  );

  let audio = null;
  let armed = false;
  // The standing intent, which is not the same as whether audio is playing:
  // between a click and play() resolving, this is already true. The error
  // handler reads it to know whether there is anything left to correct.
  let wanted = false;
  // Bumped on every change of intent. A play() that resolves after the visitor
  // has asked for silence checks this and stands down rather than painting ON
  // over their decision.
  let gen = 0;

  // localStorage throws rather than returning null under some privacy settings,
  // and is missing outright for a file:// page in a few browsers. Neither is
  // reason to lose the control, so reads and writes are both best effort.
  const remember = (value) => {
    try {
      localStorage.setItem(KEY, value);
    } catch {}
  };

  const recall = () => {
    try {
      return localStorage.getItem(KEY);
    } catch {
      return null;
    }
  };

  function paint(on) {
    for (const [name, button] of options) {
      const current = (name === "on") === on;
      button.classList.toggle("is-current", current);
      button.setAttribute("aria-pressed", String(current));
    }
  }

  // Waiting for the first gesture after a blocked autoplay. Both listeners have
  // to come off together, so neither uses { once: true }.
  function arm() {
    if (armed) return;
    armed = true;
    addEventListener("pointerdown", wake);
    addEventListener("keydown", wake);
  }

  function disarm() {
    if (!armed) return;
    armed = false;
    removeEventListener("pointerdown", wake);
    removeEventListener("keydown", wake);
  }

  function wake() {
    disarm();
    start(false);
  }

  /* `asked` separates a click on ON from a restore on load. A click gets
   * optimistic feedback, because play() doesn't resolve until audio actually
   * starts and over 2MB that is a visible wait in which the control would feel
   * dead. A restore gets none, because it is expected to be refused. */
  function start(asked) {
    const mine = ++gen;
    disarm();
    wanted = true;

    if (asked) {
      paint(true);
      remember("on");
    }

    if (!audio) {
      audio = new Audio(TRACK);
      audio.loop = true;
      // Bound once, so it outlives any single call and can't close over a
      // generation. The standalone file opened offline, or the host moving out
      // from under the URL, both land here. Reverting quietly is the right
      // failure: this is a holding page, not a player, and an error nobody can
      // act on is worse than silence.
      audio.addEventListener("error", () => {
        if (wanted) paint(false);
      });
    }

    audio.volume = VOLUME;
    // Older Safari returns undefined from play() rather than a promise.
    Promise.resolve(audio.play())
      .then(() => {
        if (gen !== mine) return;
        paint(true);
        remember("on");
      })
      .catch(() => {
        if (gen !== mine) return;
        paint(false);
        if (asked) {
          // Not the autoplay policy: this followed a real click. Something else
          // failed, so don't leave behind a preference that can't be honoured.
          remember("off");
        } else {
          // Expected on a fresh load, where the policy wants a gesture first.
          // The preference stands and the next interaction anywhere starts it.
          arm();
        }
      });
  }

  function stop() {
    gen++;
    disarm();
    wanted = false;
    paint(false);
    remember("off");
    if (audio) audio.pause();
  }

  options.get("on").addEventListener("click", () => start(true));
  options.get("off").addEventListener("click", stop);

  if (recall() === "on") start(false);
})();
</script>
<script>
/* Counts down to 15:00 WAT on 1 October 2026. WAT is UTC+1 with no DST, so the
 * target is a fixed instant and the page shows the same remaining time in every
 * timezone.
 *
 * At zero the clock stops on 00:00:00 and the headline swaps. Hours are padded
 * like the other two units so that final state reads as a whole clock rather
 * than "0:00:00", and so the line doesn't reflow when it drops below ten.
 *
 * #intro-end previews that finished state without waiting for the clock. It is
 * not a view of its own: views.js doesn't recognise it, so it falls through to
 * the intro, and the only thing that changes here is the reading of how much
 * time is left. Navigating away restores the real countdown, so the preview
 * can't get stuck.
 */
(() => {
  const TARGET = Date.UTC(2026, 9, 1, 14, 0, 0);
  const PREVIEW_HASH = "#intro-end";

  const headline = document.querySelector(".headline");
  const hours = document.getElementById("hours");
  const minutes = document.getElementById("minutes");
  const seconds = document.getElementById("seconds");

  const WAITING_HEADLINE = headline.innerHTML;
  const LIVE_HEADLINE = "GAMES NIGHT<br>IS LIVE \u{1F525}";

  const pad = (n) => String(n).padStart(2, "0");

  // Tri-state, so the first call always writes and later ones only touch the
  // headline when the state actually flips rather than once a second.
  let live = null;
  let timer = null;

  function setLive(next) {
    if (next === live) return;
    live = next;
    headline.innerHTML = next ? LIVE_HEADLINE : WAITING_HEADLINE;
    headline.classList.toggle("is-live", next);
  }

  function tick() {
    clearTimeout(timer);

    const left =
      location.hash === PREVIEW_HASH ? 0 : Math.max(0, TARGET - Date.now());
    const total = Math.floor(left / 1000);

    hours.textContent = pad(Math.floor(total / 3600));
    minutes.textContent = pad(Math.floor(total / 60) % 60);
    seconds.textContent = pad(total % 60);
    setLive(left === 0);

    if (left > 0) timer = setTimeout(tick, 1000 - (Date.now() % 1000));
  }

  tick();
  addEventListener("hashchange", tick);
  // A backgrounded tab has its timers throttled, and a frozen or suspended one
  // has them deferred outright, so the swap can land late for anyone who left
  // the page open across the start. tick() clears its own pending timer before
  // doing anything, so calling it again is safe: it just re-reads the clock and
  // re-arms. Returning to the tab therefore always shows the true state rather
  // than whatever the last timer that managed to run left behind.
  // Deliberately not gated on document.hidden. Ticking on the way out is
  // harmless, and trusting that flag would mean trusting the one thing that is
  // unreliable here: anything that reports the page hidden while it is on
  // screen would suppress the very correction this exists to make.
  // Bound to document, which is where the event is actually fired. It does
  // bubble to window, but there is no reason to depend on that.
  document.addEventListener("visibilitychange", tick);
})();
</script>
<script>
/* Two views over one shared background: the countdown and the run of show.
 *
 * The grid never re-renders — only the foreground cross-fades, driven by the
 * URL hash so the browser's back button returns to the countdown.
 *
 * The intro enters from above and exits below, so it only ever drifts
 * downwards. That needs two distinct off states, hence the is-leaving class.
 *
 * The run of show is the People & Operations programme for 1 October 2026.
 * Durations chain into the following start time everywhere except the welcome,
 * which leaves five minutes of slack before the icebreaker, so start times are
 * authored rather than derived.
 */
(() => {
  const SEGMENTS = [
    {
      time: "3:00PM",
      title: "Arrival & settle in",
      detail: "Music on, snacks out, teams find their spots",
      duration: "10 min",
    },
    {
      time: "3:10PM",
      title: "Welcome & house rules",
      detail: "Ayo opens · teams, scoring, prizes",
      duration: "10 min",
    },
    {
      time: "3:25PM",
      title: "Icebreaker",
      detail: "Two Truths & a Lie · quick-fire round",
      duration: "15 min",
    },
    {
      time: "3:40PM",
      title: "Game 1 — Word scramble",
      detail: "Rebus puzzles · Tournament",
      duration: "30 min",
    },
    {
      time: "4:10PM",
      title: "Break & refreshments",
      detail: "Reset drinks, mingle, catch breath",
      duration: "15 min",
    },
    {
      time: "4:25PM",
      title: "Game 2 — Company Quiz",
      detail: "10 to 15 questions · AIENAI, values, WoW",
      duration: "25 min",
    },
    {
      time: "4:50PM",
      title: "Game 3 — Imposter",
      detail: "Peak-energy closer for the games section",
      duration: "30 min",
    },
    {
      time: "5:20PM",
      title: "Scores & EOQ moment",
      detail: "Team scores tallied · EOQ winner announced · winning team prize",
      duration: "20 min",
    },
    {
      time: "5:40PM",
      title: "Words from Fe / Ini",
      detail: "Quarter wrap · thank-yous · look-ahead",
      duration: "10 min",
    },
    {
      time: "5:50PM",
      title: "Group photo",
      detail: "Wardrobe reset · team + individual shots",
      duration: "10 min",
    },
    {
      time: "6:00PM",
      title: "Free flow",
      detail: "Music up, drinks out, roll into dinner venue",
      duration: "",
    },
  ];

  const escape = (s) =>
    s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  document.getElementById("schedule-rows").innerHTML = SEGMENTS.map(
    (s) => `<div class="schedule-row">
      <span class="col-time">${escape(s.time)}</span>
      <span class="col-segment"><b>${escape(s.title)}</b><small>${escape(s.detail)}</small></span>
      <span class="col-duration">${escape(s.duration)}</span>
    </div>`
  ).join("");

  const views = new Map(
    [...document.querySelectorAll(".view")].map((el) => [el.id, el])
  );

  function show(name, initial) {
    const active = views.has(name) ? name : "intro";

    for (const [id, el] of views) {
      const isActive = id === active;

      if (isActive && el.classList.contains("is-leaving")) {
        // Return to the pre-entry offset. The view is transparent here, but the
        // jump still has to be committed unanimated or it plays in reverse.
        el.classList.add("no-transition");
        el.classList.remove("is-leaving");
        el.offsetHeight;
        el.classList.remove("no-transition");
      } else if (!isActive && el.classList.contains("is-active")) {
        el.classList.add("is-leaving");
      }

      el.classList.toggle("is-active", isActive);
      el.setAttribute("aria-hidden", String(!isActive));
    }

    if (!initial) {
      views.get(active).querySelector("[data-focus]").focus({ preventScroll: true });
    }
  }

  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1), true);
})();
</script>
</body>
